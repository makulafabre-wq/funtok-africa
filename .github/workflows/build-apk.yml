name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (22 for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Bundle web assets without badge
        run: |
          python3 - << 'PYEOF'
          import urllib.request, re, os

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          base_url = "https://funtok-africa.lovable.app"

          req = urllib.request.Request(base_url, headers=headers)
          html = urllib.request.urlopen(req).read().decode("utf-8")

          # Remove lovable badge completely
          html = re.sub(r'<style>\s*#lovable-badge.*?</style>', '', html, flags=re.DOTALL)
          html = re.sub(r'<aside id="lovable-badge".*?</aside>', '', html, flags=re.DOTALL)
          html = re.sub(r'<script>\s*\(\(\)\s*=>\s*\{\s*if\s*\(window\.self.*?lovable-badge.*?</script>', '', html, flags=re.DOTALL)

          assets = set(re.findall(r'["\'](/assets/[^"\']+)["\']', html))
          print(f"Bundling {len(assets)} assets for offline native app...")

          os.makedirs("dist/client/assets", exist_ok=True)
          with open("dist/client/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          downloaded = 0
          for asset in sorted(assets):
              full_url = base_url + asset
              local_path = "dist/client" + asset
              os.makedirs(os.path.dirname(local_path), exist_ok=True)
              try:
                  areq = urllib.request.Request(full_url, headers=headers)
                  with urllib.request.urlopen(areq) as resp:
                      content = resp.read()
                      with open(local_path, "wb") as out:
                          out.write(content)
                  downloaded += 1
              except Exception as e:
                  print(f"Warning downloading {asset}: {e}")

          print(f"Successfully packaged {downloaded} assets into dist/client!")
          PYEOF

      - name: Add Android platform
        run: |
          npm install @capacitor/android@^8.5.3 --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Funtok app logo and launcher icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          cat << "SVG" > /tmp/funtok_icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a478ff" />
                <stop offset="100%" stop-color="#fb2c5f" />
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" fill="#000000" rx="220" />
            <g transform="translate(192, 192)">
              <rect width="640" height="640" rx="160" fill="url(#brandGrad)" />
              <rect x="70" y="580" width="60" height="60" rx="8" fill="#a478ff" transform="rotate(45 100 610)" />
              <g transform="translate(160, 160) scale(13.3333333333)">
                <path
                  d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"
                  fill="#ffffff"
                  stroke="#ffffff"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </g>
          </svg>
          SVG

          for item in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
            dim="${item%%:*}"
            dens="${item##*:}"
            target_dir="android/app/src/main/res/mipmap-${dens}"
            mkdir -p "$target_dir"
            rsvg-convert -w "$dim" -h "$dim" /tmp/funtok_icon.svg -o "${target_dir}/ic_launcher.png"
            cp "${target_dir}/ic_launcher.png" "${target_dir}/ic_launcher_round.png"
            cp "${target_dir}/ic_launcher.png" "${target_dir}/ic_launcher_foreground.png"
          done

      - name: Configure branded app open splash screen
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat << "EOF" > android/app/src/main/res/drawable/splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/black" />
              <item
                  android:width="120dp"
                  android:height="120dp"
                  android:gravity="center"
                  android:drawable="@mipmap/ic_launcher_round" />
          </layer-list>
          EOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Android permissions, hardware acceleration, and AdMob
        run: |
          python3 - << "EOF"
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              data = f.read()

          # Enable hardware acceleration and cleartext traffic
          if "usesCleartextTraffic" not in data:
              data = data.replace('android:allowBackup="true"', 'android:allowBackup="true"\n        android:hardwareAccelerated="true"\n        android:usesCleartextTraffic="true"')

          # Inject AdMob App ID
          admob_tags = """        <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3877753844959715~4589245523"/>
                  <meta-data
                      android:name="com.google.android.gms.ads.DELAY_APP_MEASUREMENT_INIT"
                      android:value="true"/>"""
          if "com.google.android.gms.ads.APPLICATION_ID" not in data:
              data = data.replace("</application>", f"{admob_tags}\n    </application>")

          # Inject permissions
          perms = [
              "INTERNET",
              "CAMERA",
              "RECORD_AUDIO",
              "MODIFY_AUDIO_SETTINGS",
              "READ_MEDIA_VIDEO",
              "READ_MEDIA_IMAGES",
              "POST_NOTIFICATIONS"
          ]
          for p in perms:
              tag = f'    <uses-permission android:name="android.permission.{p}" />'
              if f'android.permission.{p}' not in data:
                  data = data.replace("</manifest>", f"{tag}\n</manifest>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(data)
          EOF

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: funtok-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
