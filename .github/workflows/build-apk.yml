name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (22 for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Bundle all web assets, eliminate 404s and fix hydration
        run: |
          python3 - << 'PYEOF_INNER'
          import urllib.request, re, os, shutil

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          base_url = "https://funtok-africa.lovable.app"

          req = urllib.request.Request(base_url, headers=headers)
          html = urllib.request.urlopen(req).read().decode("utf-8")

          # 1. Permanently wipe Lovable badge elements, scripts, and styles
          html = re.sub(r'<aside\s+[^>]*id=["\']lovable-badge["\'].*?</aside>', '', html, flags=re.DOTALL | re.IGNORECASE)
          html = re.sub(r'<style[^>]*>[^<]*#lovable-badge.*?</style>', '', html, flags=re.DOTALL | re.IGNORECASE)
          html = re.sub(r'<script[^>]*>[^<]*lovable-badge.*?</script>', '', html, flags=re.DOTALL | re.IGNORECASE)
          html = re.sub(r'<script[^>]*src=["\']/__l5e/[^"\']+["\'][^>]*></script>', '', html, flags=re.DOTALL | re.IGNORECASE)

          # Inject CSS to ensure no badge ever appears and prevent layout bleeding
          badge_killer_css = '''
          <style id="funtok-badge-killer">
            #lovable-badge, aside#lovable-badge, [id*="lovable-badge"], .lovable-badge {
              display: none !important;
              opacity: 0 !important;
              visibility: hidden !important;
              pointer-events: none !important;
              width: 0 !important;
              height: 0 !important;
              max-height: 0 !important;
              overflow: hidden !important;
              position: absolute !important;
              top: -9999px !important;
            }
            html, body {
              background-color: #000000 !important;
              overflow-x: hidden !important;
              touch-action: pan-y !important;
            }
          </style>
          '''
          html = html.replace('</head>', badge_killer_css + '</head>')

          # 2. Fix client-side hydration and path resolution for mobile
          runtime_fix_script = '''
          <script>
            if (window.location.pathname.endsWith('/index.html')) {
              window.history.replaceState(null, '', window.location.pathname.replace(/index\.html$/, '') || '/');
            }
            window.addEventListener('error', function(e) {
              console.error('Runtime error:', e.message, e.filename, e.lineno);
            });
            window.addEventListener('unhandledrejection', function(e) {
              console.error('Unhandled rejection:', e.reason);
            });
          </script>
          '''
          html = html.replace('<head>', '<head>' + runtime_fix_script)

          # 3. Discover all assets across all pages and dynamic JS chunk imports
          routes = ["/", "/chat", "/market", "/upload", "/auth"]
          all_assets = set()

          for r in routes:
              try:
                  r_req = urllib.request.Request(base_url + r, headers=headers)
                  r_html = urllib.request.urlopen(r_req).read().decode("utf-8")
                  matches = re.findall(r'["\'](/assets/[A-Za-z0-9_\-\.]+\.[a-z0-9]+)["\']', r_html)
                  all_assets.update(matches)
              except Exception as e:
                  print(f"Error checking route {r}: {e}")

          queue = [a for a in all_assets if a.endswith(".js")]
          visited = set(queue)

          while queue:
              curr = queue.pop(0)
              try:
                  url = base_url + curr
                  c_req = urllib.request.Request(url, headers=headers)
                  code = urllib.request.urlopen(c_req).read().decode("utf-8")
                  matches = re.findall(r'["\'](\.?/assets/[A-Za-z0-9_\-\.]+\.[a-z0-9]+|\./[A-Za-z0-9_\-\.]+\.[a-z0-9]+)["\']', code)
                  for m in matches:
                      if m.startswith("./"):
                          c = "/assets/" + m[2:]
                      elif m.startswith("/assets/"):
                          c = m
                      else:
                          continue
                      all_assets.add(c)
                      if c not in visited and c.endswith(".js"):
                          visited.add(c)
                          queue.append(c)
              except Exception as e:
                  print(f"Error analyzing chunk {curr}: {e}")

          print(f"Completely mapped {len(all_assets)} assets across all Funtok routes and code-split chunks.")

          targets = [".output/public", "dist/client"]
          for target in targets:
              os.makedirs(f"{target}/assets", exist_ok=True)
              with open(f"{target}/index.html", "w", encoding="utf-8") as f:
                  f.write(html)

              # Eliminate 404s by creating route directory index files
              for route_name in ["auth", "chat", "market", "upload"]:
                  route_dir = f"{target}/{route_name}"
                  os.makedirs(route_dir, exist_ok=True)
                  with open(f"{route_dir}/index.html", "w", encoding="utf-8") as rf:
                      rf.write(html)
                  with open(f"{target}/{route_name}.html", "w", encoding="utf-8") as rf2:
                      rf2.write(html)

          downloaded = 0
          for asset in sorted(all_assets):
              full_url = base_url + asset
              try:
                  areq = urllib.request.Request(full_url, headers=headers)
                  with urllib.request.urlopen(areq) as resp:
                      content = resp.read()
                      for target in targets:
                          local_path = target + asset
                          os.makedirs(os.path.dirname(local_path), exist_ok=True)
                          with open(local_path, "wb") as out:
                              out.write(content)
                  downloaded += 1
              except Exception as e:
                  print(f"Warning downloading {asset}: {e}")

          print(f"Successfully packaged {downloaded} assets and eliminated route 404s!")
          PYEOF_INNER

      - name: Add Android platform
        run: |
          npm install @capacitor/android@^8.5.3 --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate borderless Funtok app logo and TikTok Lite splash screen
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin

          # 1. Full-bleed gradient app icon (no black surrounding)
          cat << "SVG" > /tmp/funtok_icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a478ff" />
                <stop offset="100%" stop-color="#fb2c5f" />
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" fill="url(#brandGrad)" />
            <g transform="translate(256, 256) scale(21.3333333333)">
              <path
                d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594l1.051-5.558z"
                fill="#ffffff"
                stroke="#ffffff"
                stroke-width="0.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
          </svg>
          SVG

          # Write app launcher icons
          for item in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
            dim="${item%%:*}"
            dens="${item##*:}"
            target_dir="android/app/src/main/res/mipmap-${dens}"
            mkdir -p "$target_dir"
            rsvg-convert -w "$dim" -h "$dim" /tmp/funtok_icon.svg -o "${target_dir}/ic_launcher.png"
            cp "${target_dir}/ic_launcher.png" "${target_dir}/ic_launcher_round.png"
            cp "${target_dir}/ic_launcher.png" "${target_dir}/ic_launcher_foreground.png"
          done

          # 2. TikTok Lite style Splash Screen (Pure black, centered glowing logo, bold Funtok, tagline)
          cat << "SPLASH_SVG" > /tmp/funtok_splash.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
            <defs>
              <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a478ff" />
                <stop offset="100%" stop-color="#fb2c5f" />
              </linearGradient>
            </defs>
            <rect width="1080" height="1920" fill="#000000" />
            <g transform="translate(440, 780)">
              <rect width="200" height="200" rx="50" fill="url(#brandGrad)" />
              <g transform="translate(50, 50) scale(4.1666666667)">
                <path
                  d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594l1.051-5.558z"
                  fill="#ffffff"
                  stroke="#ffffff"
                  stroke-width="1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </g>
            <text x="540" y="1050" font-family="sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">Funtok</text>
            <text x="540" y="1110" font-family="sans-serif" font-size="24" font-weight="normal" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.5">Save data, infinite happiness</text>
          </svg>
          SPLASH_SVG

          # Write splash drawables across Android screen densities
          mkdir -p android/app/src/main/res/drawable
          rsvg-convert -w 1080 -h 1920 /tmp/funtok_splash.svg -o android/app/src/main/res/drawable/splash.png

          for item in 320:480:mdpi 480:800:hdpi 720:1280:xhdpi 960:1600:xxhdpi 1280:1920:xxxhdpi; do
            w="${item%%:*}"
            rest="${item#*:}"
            h="${rest%%:*}"
            dens="${rest##*:}"
            splash_dir="android/app/src/main/res/drawable-port-${dens}"
            mkdir -p "$splash_dir"
            rsvg-convert -w "$w" -h "$h" /tmp/funtok_splash.svg -o "${splash_dir}/splash.png"
          done

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure MainActivity with glitch-free black background and edge-to-edge bars
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import re

          matches = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(matches) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(matches)}")

          path = matches[0]
          old_source = path.read_text(encoding="utf-8")
          package_match = re.search(r"^\s*package\s+[\w.]+\s*;", old_source, re.MULTILINE)
          if not package_match:
              raise SystemExit("No package line")
          package_line = package_match.group(0).strip()

          new_source = f"""{package_line}

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  // Fix GPU buffer bleed: replace splash drawable with solid black window background
                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                  if (getBridge() != null && getBridge().getWebView() != null) {{
                      getBridge().getWebView().setBackgroundColor(Color.BLACK);
                  }}
                  applyImmersiveEdgeToEdge();
              }}

              private void applyImmersiveEdgeToEdge() {{
                  Window window = getWindow();
                  window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS | WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION);
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {{
                      window.setDecorFitsSystemWindows(false);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {{
                          window.setStatusBarContrastEnforced(false);
                          window.setNavigationBarContrastEnforced(false);
                      }}
                  }} else {{
                      window.getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }}
              }}

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {{
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {{
                      applyImmersiveEdgeToEdge();
                  }}
              }}
          }}
          """
          path.write_text(new_source, encoding="utf-8")
          print("Rewrote MainActivity for solid black and glitch-free edge-to-edge!")
          PY

      - name: Configure clean launch theme and solid black background in styles.xml
        run: |
          python3 - << "EOF"
          import re
          from pathlib import Path

          for styles_path in Path("android/app/src/main/res").rglob("styles.xml"):
              content = styles_path.read_text(encoding="utf-8")
              
              # Ensure AppTheme has solid black background (prevents GPU texture glitching)
              content = re.sub(
                  r'(<style\s+name="AppTheme"[^>]*>)(.*?)(</style>)',
                  lambda m: (
                      m.group(1) +
                      re.sub(
                          r'\s*<item name="android:(?:windowBackground|colorBackground|windowTranslucentStatus|windowTranslucentNavigation|statusBarColor|navigationBarColor|windowLightStatusBar|windowLightNavigationBar)">.*?</item>',
                          '',
                          m.group(2),
                          flags=re.DOTALL
                      ) +
                      """
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:colorBackground">#000000</item>
                  <item name="android:windowTranslucentStatus">false</item>
                  <item name="android:windowTranslucentNavigation">false</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              """ +
                      m.group(3)
                  ),
                  content,
                  flags=re.DOTALL
              )

              # Update launch theme with splash drawable
              content = re.sub(
                  r'(<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)',
                  lambda m: (
                      m.group(1) +
                      re.sub(r'\s*<item name="android:windowBackground">.*?</item>', '', m.group(2), flags=re.DOTALL) +
                      """
                  <item name="android:windowBackground">@drawable/splash</item>
              """ +
                      m.group(3)
                  ),
                  content,
                  flags=re.DOTALL
              )
              styles_path.write_text(content, encoding="utf-8")
          print("Updated styles.xml successfully!")
          EOF

      - name: Configure AndroidManifest for hardware acceleration and camera
        run: |
          python3 - << "EOF"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest_path.read_text(encoding="utf-8")

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
          ]

          for perm in permissions:
              if perm not in content:
                  content = content.replace("</manifest>", f"    {perm}\n</manifest>")

          if 'android:hardwareAccelerated="true"' not in content:
              content = content.replace("<application", '<application android:hardwareAccelerated="true"')

          if 'ca-app-pub-3877753844959715~4589245523' not in content:
              admob_meta = '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3877753844959715~4589245523"/>\n'
              content = content.replace("</application>", f"{admob_meta}</application>")

          manifest_path.write_text(content, encoding="utf-8")
          print("Updated AndroidManifest.xml successfully!")
          EOF

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: funtok-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
