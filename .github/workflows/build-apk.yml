name: Build Funtok Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Funtok source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build the exact GitHub source
        run: npm run build

      - name: Prepare local Capacitor web assets
        run: |
          test -s dist/client/index.html || { echo "Missing dist/client/index.html after Vite build"; exit 1; }
          rm -rf .output/public
          mkdir -p .output/public
          cp -a dist/client/. .output/public/
          test -s .output/public/index.html
          test -n "$(find .output/public/assets -type f 2>/dev/null | head -n 1)" || { echo "No bundled JS/CSS assets found"; exit 1; }

      - name: Install the matching Capacitor Android platform
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/android@8.6.2

      - name: Create and sync the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions and AdMob app ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ANDROID = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID)
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          wanted = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_NETWORK_STATE",
          ]
          existing = {p.get(f"{{{ANDROID}}}name") for p in root.findall("uses-permission")}
          for name in wanted:
              if name not in existing:
                  ET.SubElement(root, "uses-permission", {f"{{{ANDROID}}}name": name})

          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          key = f"{{{ANDROID}}}name"
          admob = next((m for m in app.findall("meta-data") if m.get(key) == "com.google.android.gms.ads.APPLICATION_ID"), None)
          if admob is None:
              admob = ET.SubElement(app, "meta-data")
              admob.set(key, "com.google.android.gms.ads.APPLICATION_ID")
          admob.set(f"{{{ANDROID}}}value", "@string/admob_app_id")
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          strings_path = Path("android/app/src/main/res/values/strings.xml")
          strings_tree = ET.parse(strings_path)
          strings_root = strings_tree.getroot()
          app_id = next((e for e in strings_root.findall("string") if e.get("name") == "admob_app_id"), None)
          if app_id is None:
              app_id = ET.SubElement(strings_root, "string", {"name": "admob_app_id"})
          app_id.text = "ca-app-pub-3877753844959715~4589245523"
          strings_tree.write(strings_path, encoding="utf-8", xml_declaration=True)
          print("Android permissions and the configured AdMob application ID are present.")
          PY

      - name: Configure transparent system bars and Android back navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          matches = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one MainActivity.java; found {len(matches)}")
          path = matches[0]
          source = path.read_text(encoding="utf-8")
          match = re.search(r"^\s*package\s+[\w.]+\s*;", source, re.MULTILINE)
          if not match:
              raise SystemExit("MainActivity.java has no package declaration")
          package_line = match.group(0).strip()
          path.write_text(f'''{package_line}

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  applyTransparentSystemBars();
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {{
                      @Override
                      public void handleOnBackPressed() {{
                          if (getBridge() != null && getBridge().getWebView() != null
                                  && getBridge().getWebView().canGoBack()) {{
                              getBridge().getWebView().goBack();
                          }} else {{
                              finish();
                          }}
                      }}
                  }});
              }}

              private void applyTransparentSystemBars() {{
                  Window window = getWindow();
                  window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS
                          | WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION);
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {{
                      window.setDecorFitsSystemWindows(false);
                      window.setStatusBarContrastEnforced(false);
                      window.setNavigationBarContrastEnforced(false);
                  }} else {{
                      window.getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  }}
              }}

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {{
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyTransparentSystemBars();
              }}
          }}
          ''', encoding="utf-8")
          print("MainActivity configured without replacing Capacitor's WebView permission handler.")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: funtok-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
