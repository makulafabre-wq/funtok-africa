name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (22 for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Bundle web assets without badge and fix hydration
        run: |
          python3 - << 'PYEOF_INNER'
          import urllib.request, re, os

          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          base_url = "https://funtok-africa.lovable.app"

          req = urllib.request.Request(base_url, headers=headers)
          html = urllib.request.urlopen(req).read().decode("utf-8")

          html = re.sub(r'<aside\s+[^>]*id=["\']lovable-badge["\'].*?</aside>', '', html, flags=re.DOTALL | re.IGNORECASE)
          html = re.sub(r'<style[^>]*>[^<]*#lovable-badge.*?</style>', '', html, flags=re.DOTALL | re.IGNORECASE)
          html = re.sub(r'<script[^>]*>[^<]*lovable-badge.*?</script>', '', html, flags=re.DOTALL | re.IGNORECASE)
          html = re.sub(r'<script[^>]*src=["\']/__l5e/[^"\']+["\'][^>]*></script>', '', html, flags=re.DOTALL | re.IGNORECASE)

          badge_killer_css = '''
          <style id="funtok-badge-killer">
            #lovable-badge, aside#lovable-badge, [id*="lovable-badge"], .lovable-badge {
              display: none !important;
              opacity: 0 !important;
              visibility: hidden !important;
              pointer-events: none !important;
              width: 0 !important;
              height: 0 !important;
              max-height: 0 !important;
              overflow: hidden !important;
              position: absolute !important;
              top: -9999px !important;
            }
          </style>
          '''
          html = html.replace('</head>', badge_killer_css + '</head>')

          redirect_script = '''
          <script>
            if (window.location.pathname.endsWith('/index.html')) {
              window.history.replaceState(null, '', '/');
            }
          </script>
          '''
          html = html.replace('<head>', '<head>' + redirect_script)

          assets = set(re.findall(r'["\'](/assets/[^"\']+)["\']', html))
          print(f"Bundling {len(assets)} assets for offline native app...")

          targets = [".output/public", "dist/client"]
          for target in targets:
              os.makedirs(f"{target}/assets", exist_ok=True)
              with open(f"{target}/index.html", "w", encoding="utf-8") as f:
                  f.write(html)

          downloaded = 0
          for asset in sorted(assets):
              full_url = base_url + asset
              try:
                  areq = urllib.request.Request(full_url, headers=headers)
                  with urllib.request.urlopen(areq) as resp:
                      content = resp.read()
                      for target in targets:
                          local_path = target + asset
                          os.makedirs(os.path.dirname(local_path), exist_ok=True)
                          with open(local_path, "wb") as out:
                              out.write(content)
                  downloaded += 1
              except Exception as e:
                  print(f"Warning downloading {asset}: {e}")

          print(f"Successfully packaged {downloaded} assets!")
          PYEOF_INNER

      - name: Add Android platform
        run: |
          npm install @capacitor/android@^8.5.3 --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate and apply Funtok app logo
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          cat << "SVG" > /tmp/funtok_icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a478ff" />
                <stop offset="100%" stop-color="#fb2c5f" />
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" fill="#000000" rx="220" />
            <g transform="translate(192, 192)">
              <rect width="640" height="640" rx="160" fill="url(#brandGrad)" />
              <rect x="70" y="580" width="60" height="60" rx="8" fill="#a478ff" transform="rotate(45 100 610)" />
              <g transform="translate(160, 160) scale(13.3333333333)">
                <path
                  d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594l1.051-5.558z"
                  fill="#ffffff"
                  stroke="#ffffff"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
            </g>
          </svg>
          SVG

          for item in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
            dim="${item%%:*}"
            dens="${item##*:}"
            target_dir="android/app/src/main/res/mipmap-${dens}"
            mkdir -p "$target_dir"
            rsvg-convert -w "$dim" -h "$dim" /tmp/funtok_icon.svg -o "${target_dir}/ic_launcher.png"
            cp "${target_dir}/ic_launcher.png" "${target_dir}/ic_launcher_round.png"
            cp "${target_dir}/ic_launcher.png" "${target_dir}/ic_launcher_foreground.png"
          done

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Rewrite MainActivity with black system bars
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          matches = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(matches) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(matches)}")

          path = matches[0]
          old_source = path.read_text(encoding="utf-8")
          package_match = re.search(r"^\s*package\s+[\w.]+\s*;", old_source, re.MULTILINE)

          if not package_match:
              raise SystemExit(f"Could not find package declaration in {path}")

          package_line = package_match.group(0).strip()

          new_source = f"""{package_line}

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              protected void onCreate(android.os.Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  applyBlackSystemBars();
              }}

              private void applyBlackSystemBars() {{
                  android.view.Window window = getWindow();
                  window.setStatusBarColor(android.graphics.Color.BLACK);
                  window.setNavigationBarColor(android.graphics.Color.BLACK);

                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {{
                      window.setDecorFitsSystemWindows(true);

                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {{
                          window.setStatusBarContrastEnforced(false);
                          window.setNavigationBarContrastEnforced(false);
                      }}

                      android.view.WindowInsetsController controller = window.getInsetsController();
                      if (controller != null) {{
                          controller.show(
                              android.view.WindowInsets.Type.statusBars()
                                  | android.view.WindowInsets.Type.navigationBars()
                          );
                          controller.setSystemBarsAppearance(
                              0,
                              android.view.WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS
                                  | android.view.WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS
                          );
                      }}
                  }} else {{
                      window.getDecorView().setSystemUiVisibility(
                          android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }}
              }}

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {{
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {{
                      applyBlackSystemBars();
                  }}
              }}
          }}
          """

          path.write_text(new_source, encoding="utf-8")
          print(f"Rewrote {path} with black system bars.")
          PY

      - name: Configure Android manifest and app settings
        run: |
          python3 - << "EOF"
          import os
          import re
          from pathlib import Path

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              data = f.read()

          if "usesCleartextTraffic" not in data:
              data = data.replace('android:allowBackup="true"', 'android:allowBackup="true"\n        android:hardwareAccelerated="true"\n        android:usesCleartextTraffic="true"')

          admob_tags = """        <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3877753844959715~4589245523"/>
                  <meta-data
                      android:name="com.google.android.gms.ads.DELAY_APP_MEASUREMENT_INIT"
                      android:value="true"/>"""

          if "com.google.android.gms.ads.APPLICATION_ID" not in data:
              data = data.replace("</application>", admob_tags + "\n    </application>")

          for perm in ["CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "POST_NOTIFICATIONS"]:
              tag = f'    <uses-permission android:name="android.permission.{perm}" />'
              if perm not in data:
                  data = data.replace("</manifest>", tag + "\n</manifest>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(data)
          print("AndroidManifest configured successfully!")

          for styles_path in Path("android/app/src/main/res").rglob("styles.xml"):
              content = styles_path.read_text(encoding="utf-8")
              content = re.sub(
                  r"(?s)(<style\b[^>]*>)(.*?)(</style>)",
                  lambda m: (
                      m.group(1) +
                      re.sub(
                          r"\s*<item name=\"android:(?:windowTranslucentStatus|windowTranslucentNavigation|fitsSystemWindows|statusBarColor|navigationBarColor|windowLightStatusBar|windowLightNavigationBar)\">.*?</item>",
                          "",
                          m.group(2),
                          flags=re.DOTALL,
                      ) +
                      """
                      <item name="android:windowTranslucentStatus">false</item>
                      <item name="android:windowTranslucentNavigation">false</item>
                      <item name="android:fitsSystemWindows">false</item>
                      <item name="android:statusBarColor">#000000</item>
                      <item name="android:navigationBarColor">#000000</item>
                      <item name="android:windowLightStatusBar">false</item>
                      """ +
                      m.group(3)
                  ),
                  content,
                  flags=re.DOTALL,
              )
              styles_path.write_text(content, encoding="utf-8")
              print(f"Set black, non-translucent status bars in {styles_path}")
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: funtok-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
